[env:esp32dev]
platform = espressif32 @ ~7.1.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps = 
	HomeSpan=https://github.com/HomeSpan/HomeSpan.git#release-1.9.1

; Wi-Fi update: FUJI_OTA_PWD=$(security find-generic-password -s fujihk-ota -w) pio run -e ota -t upload
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.1.147
upload_flags = --auth=${sysenv.FUJI_OTA_PWD}
